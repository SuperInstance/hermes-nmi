[package]
name = "hermes-nmi"
version = "0.1.0"
edition = "2021"
description = "Neuro-Muscular Interface — the bridge between reasoning (CNS) and action (cellular agents)."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

[dev-dependencies]
tokio-test = "0.4"
